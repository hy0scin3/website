name: Update Channel Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest YouTube & TikTok metrics
        run: node .github/scripts/fetch-stats.mjs

      - name: Commit updated stats.json
        run: |
          git config user.name "hy0scin3"
          git config user.email "hyoscine7@gmail.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "chore: update channel stats"
          git push
